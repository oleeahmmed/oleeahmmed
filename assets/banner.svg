<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Md. Olee Ahmmed — Software Engineer, Backend, AI Automation and ERP Systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.35"/>
  <circle cx="1010" cy="90" r="220" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="72" y="76" font-size="15" letter-spacing="6" fill="#64748B">SOFTWARE ENGINEER</text>
    <text x="72" y="150" font-size="58" font-weight="700" letter-spacing="1" fill="#F8FAFC">Md. Olee Ahmmed</text>
    <text x="72" y="190" font-size="22" fill="#7DD3FC">Backend · AI Automation · ERP Systems</text>
    <text x="72" y="244" font-size="16" fill="#94A3B8">Createch.ca · ibitLtd · 10+ years in production software</text>
  </g>

  <g stroke="url(#accent)" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M 900 210 L 960 160 L 1030 190 L 1090 120 L 1150 150"/>
    <path d="M 960 160 L 940 90 L 1020 60"/>
    <path d="M 1030 190 L 1100 230"/>
  </g>
  <g fill="#38BDF8">
    <circle cx="900" cy="210" r="5"/>
    <circle cx="960" cy="160" r="6"/>
    <circle cx="1030" cy="190" r="5"/>
    <circle cx="1090" cy="120" r="6"/>
    <circle cx="1150" cy="150" r="4"/>
    <circle cx="940" cy="90" r="4"/>
    <circle cx="1020" cy="60" r="5"/>
    <circle cx="1100" cy="230" r="4"/>
